{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a13">
  <title>{% block title %}CineScope - Discover Movies{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'movies/css/style.css' %}">
</head>
<body>
  <!-- Sticky Glass Header -->
  <header class="site-header">
    <div class="header-container">
      <!-- Brand Logo -->
      <a href="{% url 'movies:home' %}" class="brand-logo" title="CineScope Home">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M7 3v18"/>
            <path d="M3 7.5h4"/>
            <path d="M3 12h18"/>
            <path d="M3 16.5h4"/>
            <path d="M17 3v18"/>
            <path d="M17 7.5h4"/>
            <path d="M17 16.5h4"/>
          </svg>
        </span>
        <span>Cine<span class="brand-highlight">Scope</span></span>
      </a>

      <!-- Quick Search Bar -->
      <form class="search-form" method="get" action="{% url 'movies:home' %}" role="search">
        <div class="search-input-wrapper">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
          </span>
          <input 
            type="search" 
            name="q" 
            class="search-input"
            value="{{ query|default:'' }}" 
            placeholder="Search movies, genres, titles..." 
            autocomplete="off"
            spellcheck="false"
            aria-label="Search movies">
          <button type="button" class="search-clear-btn" aria-label="Clear search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </button>
          <kbd class="search-shortcut-badge" title="Press '/' to focus search">/</kbd>
        </div>
      </form>
    </div>
  </header>

  <!-- Main Content Container -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Trailer Video Modal -->
  <div class="modal-backdrop" id="trailerModal" role="dialog" aria-modal="true" aria-label="Movie Trailer">
    <div class="modal-dialog">
      <div class="modal-header">
        <button type="button" class="modal-close-btn" id="closeTrailerBtn" aria-label="Close trailer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div class="video-embed-container" id="trailerVideoContainer">
        <!-- YouTube iframe injected dynamically by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-attribution">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M7 3v18"/>
          <path d="M17 3v18"/>
        </svg>
        <span>&copy; CineScope &bull; Built with Django &amp; TMDB API</span>
      </div>
      <div>
        <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
      </div>
    </div>
  </footer>

  <script src="{% static 'movies/js/main.js' %}"></script>
</body>
</html>
